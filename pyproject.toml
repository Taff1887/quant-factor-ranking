[project]
name = "quant-factor-ranking"
version = "0.1.0"
description = "Cross-sectional machine-learning multi-factor equity ranking model for the S&P 500"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Taffy Jackson" }]
keywords = [
    "quantitative-finance",
    "factor-investing",
    "machine-learning",
    "learning-to-rank",
    "equities",
]

dependencies = [
    # --- Core scientific stack ---
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "pyarrow>=16.0",        # Parquet IO for the data lake

    # --- Data acquisition (Financial Modeling Prep REST API) ---
    "requests>=2.32",
    "httpx>=0.27",
    "tenacity>=8.3",        # Robust retry / backoff for the API client

    # --- Configuration & ergonomics ---
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "rich>=13.7",
    "tqdm>=4.66",

    # --- Machine learning ---
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "xgboost>=2.0",
    "shap>=0.46",          # Model explainability (0.46+ supports Python 3.13)

    # --- Statistics ---
    "statsmodels>=0.14",

    # --- Visualisation ---
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "plotly>=5.22",
    "kaleido>=0.2.1",      # Static export of Plotly figures for the paper

    # --- Performance analytics ---
    "quantstats>=0.0.62",

    # --- Notebooks ---
    "jupyterlab>=4.2",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipython>=8.25",
]

[project.urls]
Repository = "https://github.com/Taff1887/quant-factor-ranking"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qfr"]

# =============================================================================
# Tooling
# =============================================================================

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
